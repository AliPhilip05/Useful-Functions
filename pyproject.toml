[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "useful-functions"
version = "0.1.0"
description = "Practical range utilities adapted from LeetCode solutions"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/AliPhilip05/Useful-Functions"

[tool.setuptools]
packages = ["useful_functions", "useful_functions.ranges"]
